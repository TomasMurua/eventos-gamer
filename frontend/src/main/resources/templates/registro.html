<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Crear cuenta')}">
    <title>Crear cuenta | Los juegos como son</title>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="contenedor hoja-contenedor">
    <section class="hoja">
        <h1 class="titulo-pagina">Crear cuenta</h1>
        <p class="hoja-bajada">Con tu cuenta puedes publicar eventos, subir fotos y videos, comentar y valorar.</p>

        <p th:if="${errorGeneral}" class="aviso aviso-error" role="alert" th:text="${errorGeneral}">Error</p>

        <form th:action="@{/registro}" th:object="${form}" method="post" class="formulario" novalidate>
            <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
                <label for="nombre">Nombre completo</label>
                <input id="nombre" type="text" th:field="*{nombre}" autocomplete="name" maxlength="80" required>
                <p class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</p>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('username')} ? 'con-error'">
                <label for="username">Nombre de usuario</label>
                <input id="username" type="text" th:field="*{username}" autocomplete="username" autocapitalize="none"
                       spellcheck="false" maxlength="40" required>
                <p class="ayuda">Así te verán en los comentarios. Letras, números, punto o guion.</p>
                <p class="error-campo" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</p>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'con-error'">
                <label for="email">Correo</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="120" required>
                <p class="error-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('password')} ? 'con-error'">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="new-password" minlength="10"
                       maxlength="64" required>
                <p class="ayuda">Mínimo 10 caracteres, con mayúsculas, minúsculas y números.</p>
                <p class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('confirmacion')} ? 'con-error'">
                <label for="confirmacion">Repite la contraseña</label>
                <input id="confirmacion" type="password" name="confirmacion" autocomplete="new-password" maxlength="64" required>
                <p class="error-campo" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}">Error</p>
            </div>
            <button type="submit" class="boton">Crear cuenta</button>
        </form>
        <p class="hoja-nota">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa aquí</a>.</p>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
