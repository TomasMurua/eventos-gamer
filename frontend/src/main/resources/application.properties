spring.application.name=eventos-gamer
server.port=${PORT:8080}

# URL interna de la API del backend (en Docker no sale a Internet)
app.backend-url=${BACKEND_URL:http://localhost:8081}

# No exponer detalles internos en las paginas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Sesion: dura lo mismo que el token JWT; cookie solo por HTTPS, sin acceso desde JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie

# La aplicacion queda detras del proxy HTTPS: se respetan X-Forwarded-For y X-Forwarded-Proto
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*
