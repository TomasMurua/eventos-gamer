spring.application.name=eventos-gamer-api
server.port=${PORT:8081}

# Base de datos MySQL: usuario de la aplicacion con permisos minimos. Las credenciales llegan por variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/eventos_gamer
spring.datasource.username=${DB_USER:ljcs_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: el secreto es obligatorio y viene de JWT_SECRET; los tokens duran 30 minutos
jwt.secret=${JWT_SECRET:}
jwt.expiracion-minutos=30

# Bloqueo tras 5 logins fallidos durante 15 minutos (por usuario y por IP)
app.login.max-fallos=5
app.login.minutos-bloqueo=15

# Contrasenas de los usuarios: la de admin es obligatoria en produccion (el script no trae una clave usable)
app.usuarios.password-usuario=${APP_PASSWORD_USUARIO:}
app.usuarios.password-admin=${APP_PASSWORD_ADMIN:}
app.usuarios.password-llam=${APP_PASSWORD_LLAM:}

# La API queda detras del proxy HTTPS: se respetan X-Forwarded-For y X-Forwarded-Proto
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
