spring.application.name=eventos-gamer-api
server.port=${PORT:8081}

# Base de datos MySQL: usuario de la aplicacion con permisos minimos. Las credenciales llegan por variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/eventos_gamer
spring.datasource.username=${DB_USER:ljcs_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: el secreto es obligatorio y viene de JWT_SECRET; los tokens duran 30 minutos
jwt.secret=${JWT_SECRET:}
jwt.expiracion-minutos=30

# Bloqueo tras 5 logins fallidos durante 15 minutos (por usuario y por IP)
app.login.max-fallos=5
app.login.minutos-bloqueo=15

# Contrasenas de los usuarios: la de admin es obligatoria en produccion (el script no trae una clave usable)
app.usuarios.password-usuario=${APP_PASSWORD_USUARIO:}
app.usuarios.password-admin=${APP_PASSWORD_ADMIN:}
app.usuarios.password-llam=${APP_PASSWORD_LLAM:}

# La API queda detras del proxy HTTPS: se respetan X-Forwarded-For y X-Forwarded-Proto
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Registro de cuentas: maximo 5 cuentas nuevas por IP cada 60 minutos
app.registro.max-por-ip=5
app.registro.minutos-ventana=60

# Fotos (hasta 5 MB) y videos (hasta 7 MB) de los eventos: se guardan en un volumen con nombres aleatorios.
# Ninguna peticion puede pasar de 8 MB, para que una subida grande no agote la memoria del servidor.
app.medios.directorio=${MEDIOS_DIR:/data/medios}
app.medios.max-foto-bytes=5242880
app.medios.max-video-bytes=7340032
# Espacio maximo para fotos y videos por usuario (100 MB)
app.medios.cuota-usuario-bytes=104857600
spring.servlet.multipart.max-file-size=7MB
spring.servlet.multipart.max-request-size=8MB
