spring.application.name=eventos-gamer
server.port=${PORT:8080}

# Contrasenas de los usuarios de prueba. En la VM se definen con variables de entorno.
app.usuarios.password-usuario=${APP_PASSWORD_USUARIO:Gamer2026!}
app.usuarios.password-admin=${APP_PASSWORD_ADMIN:Admin2026!}
# El administrador "llam" solo se crea si APP_PASSWORD_LLAM esta definida (sin valor por defecto)
app.usuarios.password-llam=${APP_PASSWORD_LLAM:}

# No exponer detalles internos en las paginas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
