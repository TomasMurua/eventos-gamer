<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Crear cuenta')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="contenedor hoja-contenedor">
    <section class="hoja">
        <h1 class="titulo-pagina">Crear cuenta</h1>
        <p class="hoja-bajada">Regístrate para ver todos los eventos y armar tu perfil gamer.</p>

        <form th:action="@{/registro}" th:object="${registro}" method="post" class="formulario" novalidate>
            <div class="campo" th:classappend="${#fields.hasErrors('nombre')} ? 'con-error'">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" autocomplete="name" maxlength="60" required>
                <p class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('correo')} ? 'con-error'">
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" th:field="*{correo}" autocomplete="email" maxlength="100" required>
                <p class="error-campo" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('password')} ? 'con-error'">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" autocomplete="new-password"
                       minlength="8" maxlength="64" required aria-describedby="ayuda-password">
                <p class="ayuda" id="ayuda-password">Mínimo 8 caracteres.</p>
                <p class="error-campo" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="campo" th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'con-error'">
                <label for="confirmarPassword">Repite la contraseña</label>
                <input id="confirmarPassword" type="password" th:field="*{confirmarPassword}" autocomplete="new-password" required>
                <p class="error-campo" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></p>
            </div>

            <button type="submit" class="boton">Crear cuenta</button>
        </form>
        <p class="hoja-nota">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresa</a>.</p>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
