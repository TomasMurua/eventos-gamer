<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Eventos')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="contenedor seccion">
    <h1 class="titulo-pagina">Eventos</h1>

    <form th:action="@{/eventos}" method="get" class="filtros" aria-label="Buscar eventos">
        <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria">
                <option value="">Todas</option>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}" th:selected="${c == categoria}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="ciudad">Ciudad</label>
            <select id="ciudad" name="ciudad">
                <option value="">Todas</option>
                <option th:each="c : ${ciudades}" th:value="${c}" th:text="${c}" th:selected="${c == ciudad}"></option>
            </select>
        </div>
        <div class="campo">
            <label for="desde">Desde</label>
            <input id="desde" type="date" name="desde" th:value="${desde}">
        </div>
        <div class="campo">
            <label for="hasta">Hasta</label>
            <input id="hasta" type="date" name="hasta" th:value="${hasta}">
        </div>
        <div class="filtros-acciones">
            <button type="submit" class="boton">Buscar</button>
            <a class="boton boton-linea" th:href="@{/eventos}">Limpiar filtros</a>
        </div>
    </form>

    <p class="conteo" role="status"
       th:text="${#lists.size(eventos) == 1} ? '1 evento' : ${#lists.size(eventos) + ' eventos'}">7 eventos</p>

    <ol class="cartelera" th:unless="${#lists.isEmpty(eventos)}">
        <th:block th:each="evento : ${eventos}"><li th:replace="~{fragments :: fila(${evento})}"></li></th:block>
    </ol>
    <div th:if="${#lists.isEmpty(eventos)}" class="vacio">
        <p>No hay eventos con esos filtros. Prueba con otra ciudad o amplía las fechas.</p>
        <a class="boton boton-linea" th:href="@{/eventos}">Ver todos los eventos</a>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
