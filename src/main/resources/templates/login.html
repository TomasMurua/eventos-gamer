<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ingresar')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="contenedor hoja-contenedor">
    <section class="hoja">
        <h1 class="titulo-pagina">Ingresar</h1>
        <p class="hoja-bajada">Con tu cuenta ves todos los eventos y armas tu perfil.</p>

        <p th:if="${param.error}" class="aviso aviso-error" role="alert">El usuario o la contraseña no coinciden. Revisa ambos e inténtalo otra vez.</p>
        <p th:if="${param.logout}" class="aviso aviso-ok" role="status">Cerraste sesión.</p>
        <p th:if="${param.registrado}" class="aviso aviso-ok" role="status">Cuenta creada. Ya puedes ingresar.</p>

        <form th:action="@{/login}" method="post" class="formulario">
            <div class="campo">
                <label for="username">Correo o usuario</label>
                <input id="username" type="text" name="username" autocomplete="username" autocapitalize="none"
                       spellcheck="false" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="boton">Ingresar</button>
        </form>
        <p class="hoja-nota">¿No tienes cuenta? <a th:href="@{/registro}">Crea una aquí</a>.</p>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
